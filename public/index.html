<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<title>منصة سوبرسيل | تقارير خدمة العملاء</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#FBF6F6; --panel:#FFFFFF; --ink:#241417; --ink-soft:#6B5457; --line:#EDDBDC;
  --navy:#9E0F26; --navy-dark:#6E0A1B; --teal:#D41A34; --teal-soft:#FBE3E6;
  --ok:#1E7D46; --ok-soft:#E4F3E9; --warn:#9C6B00; --warn-soft:#FCF0D6;
  --bad:#B00020; --bad-soft:#FBE4E8; --info:#3A5A8C; --info-soft:#E9EEF7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== Login ===== */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 55%,#062A3A 100%);position:relative;overflow:hidden;}
#loginScreen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px);}
.login-card{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-logo{text-align:center;margin-bottom:6px;}
.login-logo .mark{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;font-weight:800;font-size:20px;margin-bottom:10px;}
.login-card h1{font-size:17px;text-align:center;margin:0 0 2px;}
.login-card p.sub{text-align:center;color:var(--ink-soft);font-size:12.5px;margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
.field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#FCFDFD;color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal);}
.btn{padding:11px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-size:14px;font-weight:700;width:100%;}
.btn:disabled{opacity:.6;}
.btn.navy{background:var(--navy);}
.btn.outline{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
.btn.danger{background:var(--bad);}
.btn.small{width:auto;padding:7px 12px;font-size:12.5px;}
.err-msg{color:var(--bad);font-size:12.5px;text-align:center;min-height:16px;margin-top:4px;}

/* ===== App shell ===== */
#app{display:none;min-height:100vh;}
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.topbar .mark{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.topbar h1{font-size:14.5px;margin:0;font-weight:700;}
.topbar .role-tag{font-size:10.5px;color:#BFE3E8;}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:12px;}
.topbar .who button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;}

.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:20;overflow-x:auto;}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;white-space:nowrap;}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.content{max-width:900px;margin:0 auto;padding:16px 14px 50px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.card h2{font-size:14.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.card h2 .bar{width:4px;height:16px;background:var(--teal);border-radius:2px;display:inline-block;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:520px){.row2{grid-template-columns:1fr;}}
.status-msg{font-size:12px;margin-top:8px;min-height:14px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:700;font-size:11.5px;}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;}
.pill.on{background:var(--ok-soft);color:var(--ok);} .pill.off{background:var(--bad-soft);color:var(--bad);}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
.badge.ok{background:var(--ok-soft);color:var(--ok);} .badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.bad{background:var(--bad-soft);color:var(--bad);} .badge.info{background:var(--info-soft);color:var(--info);}
.emp-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);margin-inline-end:6px;}
.icon-btn{border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;padding:3px 6px;}
.icon-btn.edit{color:var(--teal);} .icon-btn.del{color:var(--bad);} .icon-btn.toggle{color:var(--navy);}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:13px;}
.entry{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:#FCFDFD;}
.entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.entry-time{font-size:11px;color:var(--ink-soft);}
.entry-customer{font-size:13.5px;font-weight:700;}
.entry-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.entry-notes{font-size:12px;color:var(--ink-soft);margin-top:4px;font-style:italic;}
.date-pick{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.date-pick input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;}
.date-pick button{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--navy);}
.export-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:13.5px;font-weight:700;margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 10px;text-align:center;}
.stat-box .n{font-size:22px;font-weight:800;color:var(--navy);}
.stat-box .l{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.stat-box.accent .n{color:var(--teal);}
.chart-wrap{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:14px;}
.chart-wrap h3{font-size:12.5px;margin:0 0 10px;color:var(--ink-soft);}
.checklist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.checklist label{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--teal-soft);color:var(--teal);padding:6px 10px;border-radius:9px;font-weight:600;}
.access-note{font-size:11px;color:var(--ink-soft);background:var(--info-soft);border-radius:9px;padding:8px 10px;margin-bottom:10px;}
.form-section{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--line);}
.form-section:last-of-type{border-bottom:none;margin-bottom:6px;padding-bottom:0;}
.form-section-label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px;}
.form-section-label .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;font-weight:800;}
.hint{font-size:10.5px;color:var(--ink-soft);margin-top:-6px;margin-bottom:10px;}

/* ===== Attendance module ===== */
.shift-box{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px;background:#fff;}
.shift-box-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.shift-box-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.shift-box-icon.morning{background:linear-gradient(135deg,#3AA6D9,#1B6FA8);}
.shift-box-icon.evening{background:linear-gradient(135deg,#8B5CF6,#4C2E8C);}
.shift-box-icon.service{background:linear-gradient(135deg,#2FAE6B,#1B7A48);}
.shift-box-icon.dayoff{background:linear-gradient(135deg,#B23A55,#6E0A1B);}
.shift-box-icon.vacation{background:linear-gradient(135deg,#D4A017,#8C6B00);}
.shift-box-title{font-size:13.5px;font-weight:800;color:var(--ink);}
.shift-box-time{font-size:11px;color:var(--ink-soft);}
.shift-box-time input{border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:11px;width:78px;font-family:inherit;}
.shift-toggle{width:100%;text-align:right;padding:9px 10px;border:1px dashed var(--line);border-radius:9px;background:#FCFDFD;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.shift-chips{display:flex;flex-wrap:wrap;gap:6px;}
.shift-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:var(--teal-soft);color:var(--teal);padding:4px 9px;border-radius:99px;}
.shift-panel{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:200px;overflow-y:auto;background:#FCFDFD;display:none;}
.shift-panel.open{display:block;}
.shift-panel label{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12.5px;border-bottom:1px solid var(--line);cursor:pointer;}
.shift-panel label.shift-option-disabled{opacity:.4;cursor:not-allowed;}
.shift-panel label.shift-option-disabled input{cursor:not-allowed;}
.shift-panel label:last-child{border-bottom:none;}

.att-preview{
  width:100%;max-width:480px;margin-left:auto;margin-right:auto;background:radial-gradient(circle at 28% 6%, #FF3B4E 0%, #D4142E 32%, #9E0F26 62%, #6E0A1B 100%);
  border-radius:22px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;
  display:flex;flex-direction:column;box-sizing:border-box;
}
.att-preview::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg, rgba(255,255,255,.035) 0 2px, transparent 2px 34px);pointer-events:none;}
.att-header{position:relative;z-index:1;text-align:center;margin-bottom:8px;flex:0 0 auto;}
.att-logo img{height:30px;margin:0 auto;display:block;}
.att-meta-line{margin-top:4px;font-size:11px;color:rgba(255,255,255,.92);font-weight:700;}
.att-meta-line b{color:#fff;font-weight:800;}
.att-meta-line .sep{margin:0 6px;opacity:.6;}

.att-glass-row{position:relative;z-index:1;display:flex;flex-direction:column;gap:7px;margin-bottom:8px;flex:0 0 auto;}
.att-glass-box.morning{background:linear-gradient(120deg,rgba(255,209,102,.22),rgba(255,255,255,.14));border-color:rgba(255,209,102,.45);}
.att-glass-box.evening{background:linear-gradient(120deg,rgba(157,138,255,.24),rgba(255,255,255,.14));border-color:rgba(157,138,255,.5);}
.att-glass-box{flex:0 0 auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0;}
.att-glass-box .gh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;margin-bottom:5px;}
.att-glass-box .gh .tm{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.8);margin-inline-start:auto;}
.att-glass-names{display:flex;flex-wrap:wrap;gap:4px;}
.att-glass-names .nm-line{font-size:10px;font-weight:700;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;white-space:nowrap;flex:0 0 auto;}
.att-glass-empty{font-size:10px;color:rgba(255,255,255,.6);}

.att-service-box{position:relative;z-index:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:14px;padding:8px 10px;margin-bottom:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex:0 0 auto;}
.att-service-box .gh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;margin-bottom:4px;}
.att-service-box .sv-line{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:8px;padding:3px 8px;display:flex;justify-content:space-between;margin-bottom:2px;}
.att-service-box .sv-line span:last-child{font-weight:600;opacity:.9;}

.att-off-box{position:relative;z-index:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:14px;padding:8px 10px;margin-bottom:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex:0 0 auto;}
.att-off-box .gh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;margin-bottom:4px;}
.att-off-box .off-line{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:8px;padding:3px 8px;margin-bottom:3px;}
.att-off-box .off-line:last-child{margin-bottom:0;}
.att-off-box .off-line b{font-weight:800;}

.att-extra-line{position:relative;z-index:1;font-size:10.5px;color:rgba(255,255,255,.88);text-align:center;margin-bottom:6px;flex:0 0 auto;}

.att-tagline-big{position:relative;z-index:1;margin-top:auto;text-align:center;font-family:'Lalezar','Cairo',sans-serif;font-size:clamp(20px,4.5vw,28px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.4);letter-spacing:1px;padding-top:4px;flex:0 0 auto;line-height:1.1;}
.att-footer-mini{position:relative;z-index:1;text-align:center;font-size:8px;color:rgba(255,255,255,.75);margin-top:3px;flex:0 0 auto;}
.att-actions{display:flex;gap:10px;}
.att-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;}
.att-actions .copy-btn{background:#fff;border:1px solid var(--line);color:var(--navy);}
.att-actions .export-btn2{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;}
.readonly-banner{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:9px;margin-bottom:10px;text-align:center;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><div class="mark">SC</div></div>
    <h1>منصة سوبرسيل لخدمة العملاء</h1>
    <p class="sub">Supercell Network · FTTH</p>
    <div class="field"><label>اسم المستخدم</label><input type="text" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>كلمة السر</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn navy" id="loginBtn">تسجيل الدخول</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">SC</div>
      <div><h1>منصة سوبرسيل</h1><div class="role-tag" id="roleTag">—</div></div>
    </div>
    <div class="who">
      <span id="whoName">—</span>
      <button id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="tabs" id="tabsBar"></div>
  <div class="content" id="content"></div>
</div>

<datalist id="visitReasonList">
  <option value="Recharge Card"><option value="Recharge Card / Migrations up (60-150)">
  <option value="Recharge Card / Migrations up (60-300)"><option value="Recharge Card / Migrations up (60-1000)">
  <option value="Recharge Card / Migrations up (150-300)"><option value="Recharge Card / Migrations up (150-1000)">
  <option value="Recharge Card / Migrations up (300-1000)"><option value="Maintenance">
  <option value="Installation"><option value="Installation / Hero60Mbps"><option value="Installation / Hero 120Mbps">
  <option value="Installation / Hero 180Mbps"><option value="Purchase ONT (WiFi)"><option value="Purchase ONU">
  <option value="Mesh Device">
</datalist>
<datalist id="itemNameList">
  <option value="Hero 60Mbps Renewal 30 Days"><option value="Hero 60Mbps Renewal 90 Days">
  <option value="Hero 60Mbps Installment System"><option value="Hero 150Mbps Renewal 30 Days">
  <option value="Hero 150Mbps Renewal 90 Days"><option value="Hero 150Mbps Installment System">
  <option value="Hero 300Mbps Renewal 30 Days"><option value="Hero 300Mbps Renewal 90 Days">
  <option value="Hero 300Mbps Installment System"><option value="Hero 1000Mbps Renewal 30 Days">
  <option value="Hero 1000Mbps Renewal 90 Days"><option value="Hero 1000Mbps Installment System">
  <option value="Wifi device - ONT"><option value="Mesh device">
</datalist>

<script>

let charts = {};

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nowTimeStr(){ return new Date().toTimeString().slice(0,8); }
function statusCls(s){ const f=STATUSES.find(x=>x.v===s); return f?f.cls:"info"; }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function el(id){ return document.getElementById(id); }

async function api(url, method="GET", body){
  const opts = { method, headers:{} };
  if(body!==undefined){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  const r = await fetch(url, opts);
  const data = await r.json().catch(()=>({ok:false,error:"استجابة غير صالحة من السيرفر"}));
  if(!r.ok || data.ok===false){ throw new Error(data.error || "حدث خطأ"); }
  return data;
}

// ===================== تسجيل الدخول =====================
el("loginBtn").addEventListener("click", doLogin);
el("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

async function doLogin(){
  const username = el("loginUser").value.trim();
  const password = el("loginPass").value;
  const errBox = el("loginErr");
  errBox.textContent = "";
  if(!username || !password){ errBox.textContent = "الرجاء إدخال اسم المستخدم وكلمة السر"; return; }
  const btn = el("loginBtn");
  btn.disabled = true; btn.textContent = "جارٍ الدخول...";
  try{
    const data = await api("/api/auth/login", "POST", { username, password });
    CURRENT_USER = data.user;
    showApp();
  }catch(err){
    errBox.textContent = err.message;
  }finally{
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
  }
}

el("logoutBtn").addEventListener("click", async ()=>{
  await api("/api/auth/logout", "POST");
  location.reload();
});

async function boot(){
  try{
    const data = await api("/api/auth/me");
    CURRENT_USER = data.user;
    showApp();
  }catch(e){
    el("loginScreen").style.display = "flex";
    el("app").style.display = "none";
  }
}

function showApp(){
  el("loginScreen").style.display = "none";
  el("app").style.display = "block";
  el("roleTag").textContent = ROLE_LABELS[CURRENT_USER.role] || CURRENT_USER.role;
  el("whoName").textContent = CURRENT_USER.full_name;
  buildTabsForRole();
}

// ===================== التبويبات حسب الدور =====================
function buildTabsForRole(){
  let tabs = [];
  if(CURRENT_USER.role === "super_admin") tabs = [["offices","المكاتب"],["users","المستخدمون"]];
  else if(CURRENT_USER.role === "office_admin") tabs = [["employees","الموظفون"],["entry","إدخال بيانات"],["merged","الدمج اللحظي"],["attendance","الحضور اليومي"],["stats","الإحصائيات"]];
  else if(CURRENT_USER.role === "employee") tabs = [["entry","إدخال بيانات"],["merged","الدمج اللحظي"],["attendance","الحضور اليومي"],["stats","الإحصائيات"]];
  else if(CURRENT_USER.role === "monitor") tabs = [["merged","الدمج اللحظي"],["attendance","الحضور اليومي"],["stats","الإحصائيات"]];

  el("tabsBar").innerHTML = tabs.map((t,i)=>`<div class="tab${i===0?" active":""}" data-tab="${t[0]}">${t[1]}</div>`).join("");
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      renderTab(tab.getAttribute("data-tab"));
    });
  });
  renderTab(tabs[0][0]);
}

function renderTab(tab){
  ACTIVE_TAB = tab;
  const c = el("content");
  c.innerHTML = "";
  if(tab==="offices") renderOffices(c);
  else if(tab==="users") renderUsers(c);
  else if(tab==="employees") renderEmployees(c);
  else if(tab==="entry") renderEntryForm(c);
  else if(tab==="merged") renderMerged(c);
  else if(tab==="attendance") renderAttendance(c);
  else if(tab==="stats") renderStats(c);
}

// ===================== المدير العام: المكاتب =====================
async function renderOffices(c){
  c.innerHTML = `
    <div class="card">
      <h2><span class="bar"></span>إضافة مكتب جديد</h2>
      <div class="field"><label>اسم المكتب/الفرع</label><input type="text" id="newOfficeName" placeholder="مثال: Samarra Shop"></div>
      <button class="btn" id="addOfficeBtn">إضافة المكتب</button>
      <div class="status-msg" id="officeMsg"></div>
    </div>
    <div class="card"><h2><span class="bar"></span>المكاتب الحالية</h2><div id="officesList"><div class="empty">جارٍ التحميل...</div></div></div>
  `;
  el("addOfficeBtn").addEventListener("click", async ()=>{
    const name = el("newOfficeName").value.trim();
    const msg = el("officeMsg");
    if(!name){ msg.style.color="#B00020"; msg.textContent="اكتب اسم المكتب"; return; }
    try{
      await api("/api/superadmin/offices","POST",{name});
      el("newOfficeName").value="";
      msg.style.color="#1E7D46"; msg.textContent="تمت الإضافة";
      loadOfficesList();
    }catch(err){ msg.style.color="#B00020"; msg.textContent=err.message; }
  });
  loadOfficesList();
}
async function loadOfficesList(){
  const box = el("officesList");
  const data = await api("/api/superadmin/offices");
  if(data.offices.length===0){ box.innerHTML='<div class="empty">لا توجد مكاتب بعد</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>المكتب</th><th>تاريخ الإنشاء</th><th></th></tr></thead><tbody>
    ${data.offices.map(o=>`<tr>
      <td>${escapeHtml(o.name)}</td>
      <td>${new Date(o.created_at).toLocaleDateString("ar-EG")}</td>
      <td><button class="icon-btn del" data-id="${o.id}">حذف</button></td>
    </tr>`).join("")}
  </tbody></table>`;
  box.querySelectorAll(".del").forEach(b=>b.addEventListener("click", async ()=>{
    if(!confirm("حذف هذا المكتب سيحذف كل بياناته وموظفيه. متابعة؟")) return;
    await api("/api/superadmin/offices/"+b.getAttribute("data-id"), "DELETE");
    loadOfficesList();
  }));
}

        loadUsersList(offices);
      }catch(err){ msg.style.color = "#B00020"; msg.textContent = err.message; }
    });
  }));
  box.querySelectorAll("[data-act='toggle']").forEach(b=>b.addEventListener("click", async ()=>{
    await api("/api/superadmin/users/"+b.getAttribute("data-id")+"/toggle","PUT");
    loadUsersList(offices);

  box.querySelectorAll("[data-act='del']").forEach(b=>b.addEventListener("click", async ()=>{

    await api("/api/superadmin/users/"+b.getAttribute("data-id"), "DELETE");
    loadUsersList(offices);
  }));
  box.querySelectorAll("[data-act='access']").forEach(b=>b.addEventListener("click", async ()=>{
    const uid = b.getAttribute("data-id");
    const wrap = el("access_"+uid);
    if(wrap.style.display==="block"){ wrap.style.display="none"; return; }
    const current = await api("/api/superadmin/monitor-access/"+uid);

  };

function resetEntryForm(){
  entryEditId = null;
  ["f_customer","f_phone","f_bg","f_reason","f_price","f_item","f_id","f_migrations","f_revenue","f_notes"].forEach(id=>el(id).value="");

function isMultipleOf5(v){
  if(v===null || v===undefined || v==="") return true;
  const n = Number(v);
  return Number.isFinite(n) && n % 5 === 0;
}
async function saveEntry(){
  const payload = readEntryForm();
  const msg = el("entryMsg");
  if(!payload.customer_name){ msg.style.color="#B00020"; msg.textContent="الرجاء إدخال اسم العميل"; return; }
  if(!isMultipleOf5(payload.price)){ msg.style.color="#B00020"; msg.textContent="السعر يجب أن يكون من مضاعفات 5 (5، 10، 15 ...)"; return; }
  if(!isMultipleOf5(payload.revenue_amount)){ msg.style.color="#B00020"; msg.textContent="Revenue Amount يجب أن يكون من مضاعفات 5 (5، 10، 15 ...)"; return; }
  const btn = el("saveEntryBtn");
  btn.disabled = true;
  try{
    if(entryEditId){ await api("/api/entries/"+entryEditId, "PUT", payload); msg.style.color="#1E7D46"; msg.textContent="تم حفظ التعديل"; }
    else { await api("/api/entries", "POST", payload); msg.style.color="#1E7D46"; msg.textContent="تمت الإضافة"; }
    resetEntryForm();
    loadMyList();
  }catch(err){ msg.style.color="#B00020"; msg.textContent="تعذر الحفظ: "+err.message; }
  finally{ btn.disabled = false; }
}
async function loadMyList(){
  const box = el("myList");
  const data = await api("/api/entries/mine?date="+todayStr());
  if(data.entries.length===0){ box.innerHTML='<div class="empty">لم تتم إضافة أي معاملة بعد</div>'; return; }

    if(!confirm("حذف هذه المعاملة؟")) return;

    const entry = data.entries.find(e=>String(e.id)===b.getAttribute("data-id"));

}

  let offices = [];
  if(ATT.isMonitor){
    const data = await api("/api/monitor/offices");
    offices = data.offices;
    if(offices.length===0){ c.innerHTML = '<div class="card"><div class="empty">لا تملك صلاحية الاطلاع على أي مكتب حالياً</div></div>'; return; }
    officeSelectHtml = `<div class="field"><label>المكتب</label><select id="attOfficeSelect">${offices.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join("")}</select></div>`;
  }

  c.innerHTML = `
    ${ATT.isMonitor ? `<div class="card">${officeSelectHtml}<div class="readonly-banner" style="margin-top:8px;">وضع القراءة فقط — يعرض آخر سجل محفوظ فقط</div></div>` : ""}
    <div class="card">
      <h2><span class="bar"></span>بيانات اليوم</h2>
      <div class="row2">
        <div class="field"><label>التاريخ</label><input type="date" id="att_date"></div>
        <div class="field"><label>اليوم</label>
          <select id="att_day">${DAY_NAMES_AR.map(d=>`<option value="${d}">${d}</option>`).join("")}</select>
        </div>
      </div>
    </div>

    ${!ATT.isMonitor ? `
    <div class="card">
      <h2><span class="bar"></span>تعيين الموظفين للشفتات</h2>
      <div id="shiftBoxes"><div class="empty">جارٍ التحميل...</div></div>
      <button class="btn" id="attSaveBtn" style="margin-top:4px;">💾 حفظ سجل اليوم</button>
      <div class="status-msg" id="attSaveMsg"></div>
    </div>
    ` : ""}

    <div class="card">
      <h2><span class="bar"></span>معاينة البطاقة</h2>
      <div id="attPreviewWrap"></div>
      <div class="att-actions">
        <button class="copy-btn" id="attCopyBtn">📋 نسخ الرسالة</button>
        <button class="export-btn2" id="attExportImgBtn">🖼 تصدير كصورة</button>
      </div>
    </div>
  `;

  el("att_date").value = todayStr();
  el("att_day").value = attDayNameFromDate(todayStr());
  el("att_date").addEventListener("change", ()=>{ el("att_day").value = attDayNameFromDate(el("att_date").value); loadAttendanceForDate(); });
  el("att_day").addEventListener("change", updateAttPreview);
  if(ATT.isMonitor) el("attOfficeSelect").addEventListener("change", loadAttendanceForDate);
  el("attCopyBtn").addEventListener("click", copyAttendanceMessage);
  el("attExportImgBtn").addEventListener("click", exportAttendanceImage);
  if(!ATT.isMonitor) el("attSaveBtn").addEventListener("click", saveAttendance);

  await loadAttendanceForDate();
}

async function loadAttendanceForDate(){
  const date = el("att_date").value || todayStr();
  let data;
  try{
    data = ATT.isMonitor
      ? await api(`/api/monitor/offices/${el("attOfficeSelect").value}/attendance?date=${date}`)
      : await api(`/api/office/attendance?date=${date}`);
  }catch(err){
    el("attPreviewWrap").innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
    return;
  }
  ATT.roster = data.roster || [];
  ATT.officeName = data.office_name || "";
  ATT.assignments = {};
  data.entries.forEach(e=>{ ATT.assignments[e.user_id] = e.shift_type; });

  // إذا لم يوجد سجل محفوظ بعد لهذا اليوم، عيّن موظفي الخدمة تلقائياً لشفت الخدمة كافتراض مبدئي
  if(!data.day){
    ATT.roster.forEach(emp=>{
      if(emp.employee_type === "service" && !ATT.assignments[emp.id]){
        ATT.assignments[emp.id] = "service";
      }
    });
  }

  if(data.day){
    if(data.day.day_name) el("att_day").value = data.day.day_name;
    ATT.serviceStart = data.day.service_start || "10:00";
    ATT.serviceEnd = data.day.service_end || "18:00";
  }else{
    ATT.serviceStart = ATT.serviceStart || "10:00";
    ATT.serviceEnd = ATT.serviceEnd || "18:00";
  }

  if(!ATT.isMonitor) buildShiftBoxes();
  updateAttPreview();
}

function buildShiftBoxes(){
  const box = el("shiftBoxes");
  const order = ["morning","evening","service","dayoff","vacation"];
  box.innerHTML = order.map(key=>{
    const def = SHIFT_DEFS[key];
    const timeHtml = key==="service"
      ? `<span class="shift-box-time">من <input type="time" id="svc_start" value="${ATT.serviceStart||'10:00'}"> إلى <input type="time" id="svc_end" value="${ATT.serviceEnd||'18:00'}"></span>`
      : `<span class="shift-box-time">${def.time}</span>`;
    return `
      <div class="shift-box">
        <div class="shift-box-head">
          <div class="shift-box-icon ${def.cls}">${def.icon}</div>
          <div style="flex:1;">
            <div class="shift-box-title">${def.label}</div>
            ${timeHtml}
          </div>
        </div>
        <div class="shift-toggle" data-shift="${key}">اضغط لاختيار الموظفين ▾</div>
        <div class="shift-chips" id="chips_${key}"></div>
        <div class="shift-panel" id="panel_${key}">
          ${ATT.roster.map(emp=>`
            <label><input type="checkbox" data-shift="${key}" value="${emp.id}" ${ATT.assignments[emp.id]===key?"checked":""}> ${escapeHtml(emp.full_name)}</label>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");

  box.querySelectorAll(".shift-toggle").forEach(t=>{
    t.addEventListener("click", ()=>{
      const key = t.getAttribute("data-shift");
      const panel = el("panel_"+key);
      const wasOpen = panel.classList.contains("open");
      box.querySelectorAll(".shift-panel").forEach(p=>p.classList.remove("open"));
      if(!wasOpen) panel.classList.add("open");
    });
  });
  box.querySelectorAll("input[type=checkbox][data-shift]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const key = cb.getAttribute("data-shift");
      const uid = Number(cb.value);
      if(cb.checked){
        ATT.assignments[uid] = key;
      }else{
        if(ATT.assignments[uid]===key) delete ATT.assignments[uid];
      }
      refreshShiftCheckboxStates();
      renderShiftChips();
      updateAttPreview();
    });
  });
  const svcStart = el("svc_start"), svcEnd = el("svc_end");
  if(svcStart) svcStart.addEventListener("change", ()=>{ ATT.serviceStart = svcStart.value; updateAttPreview(); });
  if(svcEnd) svcEnd.addEventListener("change", ()=>{ ATT.serviceEnd = svcEnd.value; updateAttPreview(); });

  refreshShiftCheckboxStates();
  renderShiftChips();
}

// يمنع اختيار نفس الموظف في أكثر من شفت: يعطّل خانته في كل الشفتات الأخرى بمجرد تعيينه في واحد
function refreshShiftCheckboxStates(){
  document.querySelectorAll("input[type=checkbox][data-shift]").forEach(cb=>{
    const key = cb.getAttribute("data-shift");
    const uid = Number(cb.value);
    const assignedTo = ATT.assignments[uid];
    if(assignedTo && assignedTo !== key){
      cb.checked = false;
      cb.disabled = true;
      cb.parentElement.classList.add("shift-option-disabled");
    }else{
      cb.disabled = false;
      cb.checked = (assignedTo === key);
      cb.parentElement.classList.remove("shift-option-disabled");
    }
  });
}

function renderShiftChips(){
  ["morning","evening","service","dayoff","vacation"].forEach(key=>{
    const names = ATT.roster.filter(e=>ATT.assignments[e.id]===key).map(e=>e.full_name);
    const chipsBox = el("chips_"+key);
    if(!chipsBox) return;
    chipsBox.innerHTML = names.length
      ? names.map(n=>`<span class="shift-chip">${escapeHtml(n)}</span>`).join("")
      : "";
  });
}

function attRowsData(){
  const mainKeys = ["morning","evening","dayoff","vacation"];
  const mainRows = ATT.roster.filter(e=>{
    const s = ATT.assignments[e.id];
    return !s || mainKeys.includes(s);
  }).map(e=>({ name:e.full_name, shift: ATT.assignments[e.id] || "none" }));
  const serviceRows = ATT.roster.filter(e=>ATT.assignments[e.id]==="service").map(e=>({ name:e.full_name, shift:"service" }));
  return { mainRows, serviceRows };
}

function shiftTimeLabel(shift){
  if(shift==="service") return `${ATT.serviceStart||"10:00"} - ${ATT.serviceEnd||"18:00"}`;
  if(shift==="morning") return SHIFT_DEFS.morning.time;
  if(shift==="evening") return SHIFT_DEFS.evening.time;
  return "-";
}
function shiftPillHtml(shift){
  const map = { morning:"صباحي", evening:"مسائي", service:"خدمة", dayoff:"راحة", vacation:"إجازة", none:"—" };
  return `<span class="att-shift-pill ${shift}">${map[shift]}</span>`;
}
function statusPillHtml(shift){
  const present = (shift==="morning"||shift==="evening"||shift==="service");
  return present
    ? `<span class="att-status-pill present">✔ حاضر</span>`
    : `<span class="att-status-pill absent">✕ غير حاضر</span>`;
}

function updateAttPreview(){
  const date = el("att_date") ? el("att_date").value : todayStr();
  const dayName = el("att_day") ? el("att_day").value : attDayNameFromDate(date);

  const morningNames = ATT.roster.filter(e=>ATT.assignments[e.id]==="morning").map(e=>e.full_name);
  const eveningNames = ATT.roster.filter(e=>ATT.assignments[e.id]==="evening").map(e=>e.full_name);
  const serviceNames = ATT.roster.filter(e=>ATT.assignments[e.id]==="service").map(e=>e.full_name);
  const dayoffNames  = ATT.roster.filter(e=>ATT.assignments[e.id]==="dayoff").map(e=>e.full_name);
  const vacationNames= ATT.roster.filter(e=>ATT.assignments[e.id]==="vacation").map(e=>e.full_name);

  const namesListHtml = (names)=> names.length
    ? names.map(n=>`<div class="nm-line">👤 ${escapeHtml(n)}</div>`).join("")
    : `<div class="att-glass-empty">لا يوجد</div>`;

  const serviceLinesHtml = serviceNames.length
    ? serviceNames.map(n=>`<div class="sv-line"><span>👤 ${escapeHtml(n)}</span><span>${ATT.serviceStart||"10:00"} - ${ATT.serviceEnd||"18:00"}</span></div>`).join("")
    : `<div class="att-glass-empty">لا يوجد موظف خدمة اليوم</div>`;

  const offLineHtml = (icon, label, names)=> `
    <div class="off-line">${icon} <b>${label}:</b> ${names.length ? names.map(escapeHtml).join("، ") : "لا يوجد"}</div>
  `;

  const html = `
    <div class="att-preview" id="attPreviewCard">
      <div class="att-header">
        <div class="att-logo"><img src="${SUPERCELL_LOGO_WHITE_DATA_URI}" alt="Supercell"></div>
        <div class="att-meta-line">
          <b>${escapeHtml(ATT.officeName||"—")}</b><span class="sep">•</span>${escapeHtml(dayName)}<span class="sep">•</span>${escapeHtml(date)}
        </div>
      </div>

      <div class="att-glass-row">
        <div class="att-glass-box morning">
          <div class="gh">☀️ الشفت الصباحي<span class="tm">9:00 صباحا - 6:00 مساءا</span></div>
          <div class="att-glass-names">${namesListHtml(morningNames)}</div>
        </div>
        <div class="att-glass-box evening">
          <div class="gh">🌙 الشفت المسائي<span class="tm">1:00 - 10:00 مساءا</span></div>
          <div class="att-glass-names">${namesListHtml(eveningNames)}</div>
        </div>
      </div>

      <div class="att-service-box">
        <div class="gh">🛠️ موظف الخدمة</div>
        ${serviceLinesHtml}
      </div>

      <div class="att-off-box">
        <div class="gh">🛌 🌴 الراحة والإجازات</div>
        ${offLineHtml("🛌","راحة", dayoffNames)}
        ${offLineHtml("🌴","إجازة", vacationNames)}
      </div>

      <div class="att-tagline-big">احنا المستقبل</div>
      <div class="att-footer-mini">Supercell — For Internet Services LTD</div>
    </div>
  `;
  el("attPreviewWrap").innerHTML = html;
  enforceSquareSize();
}

// يفرض ارتفاعاً مساوياً للعرض بالضبط (مربع حقيقي بالبكسل)، لأن أداة تصدير الصورة لا تطبّق aspect-ratio بشكل موثوق
function enforceSquareSize(){
  const node = el("attPreviewCard");
  if(!node) return;
  requestAnimationFrame(()=>{
    const w = node.offsetWidth;
    if(w > 0) node.style.height = w + "px";
  });
}

async function saveAttendance(){
  const msg = el("attSaveMsg");
  const date = el("att_date").value || todayStr();
  const dayName = el("att_day").value;
  const entries = Object.keys(ATT.assignments).map(uid=>({ user_id: Number(uid), shift_type: ATT.assignments[uid] }));
  const btn = el("attSaveBtn");
  btn.disabled = true;
  try{
    await api("/api/office/attendance", "POST", {
      date, day_name: dayName, service_start: ATT.serviceStart, service_end: ATT.serviceEnd, entries
    });
    msg.style.color = "#1E7D46"; msg.textContent = "تم حفظ سجل اليوم بنجاح";
  }catch(err){
    msg.style.color = "#B00020"; msg.textContent = "تعذر الحفظ: "+err.message;
  }finally{
    btn.disabled = false;
  }
}

function copyAttendanceMessage(){
  const date = el("att_date").value || todayStr();
  const dayName = el("att_day").value;
  const { mainRows, serviceRows } = attRowsData();
  const map = { morning:"صباحي (9ص-6م)", evening:"مسائي (1م-10م)", service:`خدمة (${ATT.serviceStart||"10:00"}-${ATT.serviceEnd||"18:00"})`, dayoff:"راحة", vacation:"إجازة", none:"—" };
  let msg = `📋 الحضور اليومي — سوبرسيل\n`;
  msg += `🏢 المكتب: ${ATT.officeName||"—"}\n`;
  msg += `📅 ${dayName} - ${date}\n\n`;
  mainRows.forEach(r=>{ msg += `👤 ${r.name}: ${map[r.shift]}\n`; });
  if(serviceRows.length){
    msg += `\n🛠️ موظف الخدمة:\n`;
    serviceRows.forEach(r=>{ msg += `👤 ${r.name}: ${map.service}\n`; });
  }
  msg += `\nSupercell — For Internet Services LTD`;

  navigator.clipboard.writeText(msg).then(()=>{
    alert("تم نسخ الرسالة — يمكنك لصقها الآن في واتساب أو تيليجرام");
  }).catch(()=>{
    prompt("انسخ النص التالي يدوياً:", msg);
  });
}

async function exportAttendanceImage(){
  const node = el("attPreviewCard");
  if(!node || typeof html2canvas === "undefined"){ alert("تعذر تحميل أداة التصدير، تحقق من الاتصال بالإنترنت"); return; }
  const btn = el("attExportImgBtn");
  const oldText = btn.textContent;
  btn.textContent = "جارٍ التجهيز..."; btn.disabled = true;
  try{
    // تأكد أن خط العبارة الختامية محمّل فعلياً قبل الالتقاط، وإلا تظهر الكتابة مشوّهة
    if(document.fonts && document.fonts.ready){
      try{ await document.fonts.load("40px Lalezar"); }catch(e){}
      await document.fonts.ready;
    }
    // تأكد أن الارتفاع المربع مضبوط بالبكسل قبل الالتقاط مباشرة
    node.style.height = node.offsetWidth + "px";
    await new Promise(r=>setTimeout(r, 60));

    const w = node.offsetWidth, h = node.offsetHeight;
    const canvas = await html2canvas(node, { scale:2, backgroundColor:null, useCORS:true, width:w, height:h, windowWidth:w, windowHeight:h });
    const link = document.createElement("a");
    link.download = `الحضور_اليومي_${el("att_date").value||todayStr()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  }catch(err){
    alert("تعذر إنشاء الصورة: "+err.message);
  }finally{
    btn.textContent = oldText; btn.disabled = false;
  }
}

async function renderStats(c){
  const isMonitor = CURRENT_USER.role === "monitor";
  const showEmployeeBreakdown = CURRENT_USER.role === "office_admin" || isMonitor;
  let officeSelectHtml = "";
  if(isMonitor){
    const data = await api("/api/monitor/offices");
    if(data.offices.length===0){ c.innerHTML = '<div class="card"><div class="empty">لا تملك صلاحية الاطلاع على أي مكتب حالياً</div></div>'; return; }
    officeSelectHtml = `<div class="field"><label>المكتب</label><select id="statsOfficeSelect">${data.offices.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join("")}</select></div>`;
  }
  c.innerHTML = `
    ${isMonitor ? `<div class="card">${officeSelectHtml}</div>` : ""}
    <div class="card">
      <div class="date-pick"><input type="date" id="statsDate"><button id="statsTodayBtn">اليوم</button></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="n" id="st_total">0</div><div class="l">إجمالي المعاملات</div></div>
        <div class="stat-box accent"><div class="n" id="st_activation">0</div><div class="l">عدد التفعيل</div></div>
        <div class="stat-box accent"><div class="n" id="st_installation">0</div><div class="l">عدد التنصيب</div></div>
        <div class="stat-box accent"><div class="n" id="st_maintenance">0</div><div class="l">عدد الصيانة</div></div>
        <div class="stat-box"><div class="n" id="st_completed">0</div><div class="l">طلبات مكتملة</div></div>
        <div class="stat-box"><div class="n" id="st_inprogress">0</div><div class="l">قيد العمل</div></div>
        <div class="stat-box"><div class="n" id="st_closed">0</div><div class="l">مغلقة/ملغاة</div></div>
      </div>
    </div>
    <div class="chart-wrap"><h3>توزيع نوع الزيارة</h3><canvas id="chartReason" height="200"></canvas></div>
    <div class="chart-wrap"><h3>حالة الطلبات</h3><canvas id="chartStatus" height="200"></canvas></div>
    ${showEmployeeBreakdown ? `<div class="chart-wrap"><h3>توزيع المعاملات حسب الموظف (نسبة كل موظف من الإجمالي)</h3><canvas id="chartEmp" height="200"></canvas></div>` : ""}
  `;
  el("statsDate").value = todayStr();
  el("statsTodayBtn").addEventListener("click", ()=>{ el("statsDate").value = todayStr(); loadStats(); });
  el("statsDate").addEventListener("change", loadStats);
  if(isMonitor) el("statsOfficeSelect").addEventListener("change", loadStats);
  loadStats();
}
async function loadStats(){
  const date = el("statsDate").value || todayStr();
  const isMonitor = CURRENT_USER.role === "monitor";
  const showEmployeeBreakdown = CURRENT_USER.role === "office_admin" || isMonitor;
  const data = isMonitor
    ? await api(`/api/monitor/offices/${el("statsOfficeSelect").value}/stats?date=${date}`)
    : await api(`/api/office/stats?date=${date}`);
  const s = data.stats;
  el("st_total").textContent = s.total;
  el("st_activation").textContent = s.activation;
  el("st_installation").textContent = s.installation;
  el("st_maintenance").textContent = s.maintenance;
  el("st_completed").textContent = s.completed;
  el("st_inprogress").textContent = s.in_progress;
  el("st_closed").textContent = s.closed_cancelled;

  drawChart("chartReason","doughnut",["تفعيل","تنصيب","صيانة","أخرى"],[s.activation,s.installation,s.maintenance,s.other_reason],["#D41A34","#9E0F26","#9C6B00","#C9B3B6"]);
  drawChart("chartStatus","doughnut",["مكتملة","قيد العمل","مغلقة/ملغاة"],[s.completed,s.in_progress,s.closed_cancelled],["#1E7D46","#9C6B00","#B00020"]);
  if(showEmployeeBreakdown){
    const empLabels = Object.keys(s.by_employee);
    const empPalette = ["#D41A34","#9E0F26","#6E0A1B","#E6798C","#B5838D","#F2AFB9","#4A2A2E","#8C6B6E"];
    drawChart("chartEmp","doughnut",empLabels,empLabels.map(k=>s.by_employee[k]),empLabels.map((_,i)=>empPalette[i%empPalette.length]));
  }
}
function drawChart(canvasId, type, labels, data, colors){
  const ctx = el(canvasId);
  if(!ctx) return;
  if(charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(ctx, {
    type, data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: "#fff" }] },
    options: { cutout: "58%", plugins:{ legend:{ display: true, position:"bottom", labels:{font:{size:11}, boxWidth:12, padding:10} } } }
  });
}


boot();
</script>
